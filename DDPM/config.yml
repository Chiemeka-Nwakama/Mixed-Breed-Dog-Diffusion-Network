device: cuda:0

# Single-stage settings
epochs: 80
lr: 0.0001
cfg_dropout: 0.1

# Two-stage settings
stage1_epochs: 200
stage1_lr: 0.0001
stage2_epochs: 80
stage2_lr: 0.00005

# Common settings
guidance_scale: 3.0
sample_interval: 10
save_interval: 3

consume: false
consume_path: null

Dataset:
  delta_path: "/Volumes/dogdiffusion/default/diffusion_data/silver_delta"
  use_delta: true
  batch_size: 16
  image_size: 64
  mode: "RGB"
  suffix: ["png", "jpg"]
  shuffle: true
  drop_last: true
  pin_memory: true
  num_workers: 2

Model:
  in_channels: 3
  model_channels: 64
  out_channels: 3
  num_res_blocks: 2
  num_class: 120
  attention_resolutions: [8, 16]
  dropout: 0.1
  channel_mult: [1, 2, 2, 2]
  conv_resample: true
  num_heads: 4

Trainer:
  beta: [0.0001, 0.02]
  T: 1000

### callback params
Callback:
  filepath: "./checkpoints/unconditional/stage1_unconditional.pth"
  save_freq: 3